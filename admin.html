<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }
        button {
            font-size: 1.5em;
            margin: 20px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<h1>Адмін-панель</h1>

<input type="password" id="key" placeholder="Admin key">
<br>

<button id="activate">Увімкнути тривогу</button>
<button id="deactivate">Вимкнути тривогу</button>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const getKey = () => document.getElementById("key").value;

    document.getElementById("activate").onclick = () => {
        socket.emit("setAlert", {
            state: true,
            key: getKey()
        });
    };

    document.getElementById("deactivate").onclick = () => {
        socket.emit("setAlert", {
            state: false,
            key: getKey()
        });
    };
</script>

</body>
</html>
